name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run build
        env:
          # Address of the chat Worker (repository variable CHAT_API_URL). Empty = chat widget hidden.
          VITE_CHAT_API_URL: ${{ vars.CHAT_API_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # Note: deploy-pages allows at most 10 minutes (its default). If GitHub is slow and it times
        # out, the live site keeps the previous version; use "Re-run failed jobs" on the run.
        uses: actions/deploy-pages@v5
