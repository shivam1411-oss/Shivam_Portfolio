<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="codejack-icon.svg" />
    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
    <title>CodeJack | Shivam Soni</title>
    <meta name="description" content="Interactive courses: how this portfolio was built, and Python from beginner to advanced with code you can run and test in the browser." />
    <meta name="robots" content="noindex, noai, noimageai" />
    <meta name="tdm-reservation" content="1" />
    <meta name="tdm-policy" content="https://shivam-soni.com/privacy.html" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/learn/main.jsx"></script>
  </body>
</html>
