<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CodeJack">
  <!-- CodeJack logo: a Jack playing card crowned with stag antlers, over the site's code-matrix cubes.
       Used as the CodeJack header badge, its landing page logo and the learn.html tab icon. -->
  <defs>
    <linearGradient id="cj-g" gradientUnits="userSpaceOnUse" x1="10" y1="0" x2="54" y2="0">
      <stop offset="0" stop-color="#3fd1bf" />
      <stop offset="1" stop-color="#9196f6" />
    </linearGradient>
    <linearGradient id="cj-ink" gradientUnits="userSpaceOnUse" x1="21" y1="0" x2="43" y2="0">
      <stop offset="0" stop-color="#0f8a7e" />
      <stop offset="1" stop-color="#5b61d6" />
    </linearGradient>
    <radialGradient id="cj-pool" cx="32" cy="34" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0b0e" stop-opacity="0.85" />
      <stop offset="0.6" stop-color="#0a0b0e" stop-opacity="0.45" />
      <stop offset="1" stop-color="#0a0b0e" stop-opacity="0" />
    </radialGradient>
    <filter id="cj-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.8" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="cj-clip"><rect width="64" height="64" rx="14" /></clipPath>
    <path id="cj-spade" d="M0-5C2-2 5 0 5 2.2C5 4 3 5 1.4 4L2.2 6.5H-2.2L-1.4 4C-3 5-5 4-5 2.2C-5 0-2-2 0-5Z" />
  </defs>

  <g clip-path="url(#cj-clip)">
    <rect width="64" height="64" fill="#0a0b0e" />
    <!-- code-matrix cubes (8 × 8), with two lit code streams -->
    <g fill="#101a19">
      <rect x="0.5" y="0.5" width="7" height="7" rx="1.2" /><rect x="8.5" y="0.5" width="7" height="7" rx="1.2" /><rect x="16.5" y="0.5" width="7" height="7" rx="1.2" /><rect x="24.5" y="0.5" width="7" height="7" rx="1.2" /><rect x="32.5" y="0.5" width="7" height="7" rx="1.2" /><rect x="40.5" y="0.5" width="7" height="7" rx="1.2" /><rect x="48.5" y="0.5" width="7" height="7" rx="1.2" /><rect x="56.5" y="0.5" width="7" height="7" rx="1.2" />
      <rect x="0.5" y="8.5" width="7" height="7" rx="1.2" /><rect x="8.5" y="8.5" width="7" height="7" rx="1.2" /><rect x="16.5" y="8.5" width="7" height="7" rx="1.2" /><rect x="24.5" y="8.5" width="7" height="7" rx="1.2" /><rect x="32.5" y="8.5" width="7" height="7" rx="1.2" /><rect x="40.5" y="8.5" width="7" height="7" rx="1.2" /><rect x="48.5" y="8.5" width="7" height="7" rx="1.2" /><rect x="56.5" y="8.5" width="7" height="7" rx="1.2" />
      <rect x="0.5" y="16.5" width="7" height="7" rx="1.2" /><rect x="8.5" y="16.5" width="7" height="7" rx="1.2" /><rect x="16.5" y="16.5" width="7" height="7" rx="1.2" /><rect x="24.5" y="16.5" width="7" height="7" rx="1.2" /><rect x="32.5" y="16.5" width="7" height="7" rx="1.2" /><rect x="40.5" y="16.5" width="7" height="7" rx="1.2" /><rect x="48.5" y="16.5" width="7" height="7" rx="1.2" /><rect x="56.5" y="16.5" width="7" height="7" rx="1.2" />
      <rect x="0.5" y="24.5" width="7" height="7" rx="1.2" /><rect x="8.5" y="24.5" width="7" height="7" rx="1.2" /><rect x="16.5" y="24.5" width="7" height="7" rx="1.2" /><rect x="24.5" y="24.5" width="7" height="7" rx="1.2" /><rect x="32.5" y="24.5" width="7" height="7" rx="1.2" /><rect x="40.5" y="24.5" width="7" height="7" rx="1.2" /><rect x="48.5" y="24.5" width="7" height="7" rx="1.2" /><rect x="56.5" y="24.5" width="7" height="7" rx="1.2" />
      <rect x="0.5" y="32.5" width="7" height="7" rx="1.2" /><rect x="8.5" y="32.5" width="7" height="7" rx="1.2" /><rect x="16.5" y="32.5" width="7" height="7" rx="1.2" /><rect x="24.5" y="32.5" width="7" height="7" rx="1.2" /><rect x="32.5" y="32.5" width="7" height="7" rx="1.2" /><rect x="40.5" y="32.5" width="7" height="7" rx="1.2" /><rect x="48.5" y="32.5" width="7" height="7" rx="1.2" /><rect x="56.5" y="32.5" width="7" height="7" rx="1.2" />
      <rect x="0.5" y="40.5" width="7" height="7" rx="1.2" /><rect x="8.5" y="40.5" width="7" height="7" rx="1.2" /><rect x="16.5" y="40.5" width="7" height="7" rx="1.2" /><rect x="24.5" y="40.5" width="7" height="7" rx="1.2" /><rect x="32.5" y="40.5" width="7" height="7" rx="1.2" /><rect x="40.5" y="40.5" width="7" height="7" rx="1.2" /><rect x="48.5" y="40.5" width="7" height="7" rx="1.2" /><rect x="56.5" y="40.5" width="7" height="7" rx="1.2" />
      <rect x="0.5" y="48.5" width="7" height="7" rx="1.2" /><rect x="8.5" y="48.5" width="7" height="7" rx="1.2" /><rect x="16.5" y="48.5" width="7" height="7" rx="1.2" /><rect x="24.5" y="48.5" width="7" height="7" rx="1.2" /><rect x="32.5" y="48.5" width="7" height="7" rx="1.2" /><rect x="40.5" y="48.5" width="7" height="7" rx="1.2" /><rect x="48.5" y="48.5" width="7" height="7" rx="1.2" /><rect x="56.5" y="48.5" width="7" height="7" rx="1.2" />
      <rect x="0.5" y="56.5" width="7" height="7" rx="1.2" /><rect x="8.5" y="56.5" width="7" height="7" rx="1.2" /><rect x="16.5" y="56.5" width="7" height="7" rx="1.2" /><rect x="24.5" y="56.5" width="7" height="7" rx="1.2" /><rect x="32.5" y="56.5" width="7" height="7" rx="1.2" /><rect x="40.5" y="56.5" width="7" height="7" rx="1.2" /><rect x="48.5" y="56.5" width="7" height="7" rx="1.2" /><rect x="56.5" y="56.5" width="7" height="7" rx="1.2" />
    </g>
    <!-- "code" marks on the cubes; brighter down the two streams -->
    <g fill="#3fd1bf">
      <rect x="2" y="3" width="4" height="1.6" rx="0.8" opacity="0.95" /><rect x="2" y="11" width="3" height="1.6" rx="0.8" opacity="0.7" /><rect x="2" y="19" width="4" height="1.6" rx="0.8" opacity="0.5" /><rect x="2" y="27" width="2.5" height="1.6" rx="0.8" opacity="0.35" /><rect x="2" y="35" width="4" height="1.6" rx="0.8" opacity="0.22" />
      <rect x="50" y="27" width="4" height="1.6" rx="0.8" opacity="0.3" /><rect x="50" y="35" width="3" height="1.6" rx="0.8" opacity="0.5" /><rect x="50" y="43" width="4" height="1.6" rx="0.8" opacity="0.7" /><rect x="50" y="51" width="3.5" height="1.6" rx="0.8" opacity="0.95" />
      <rect x="10" y="51" width="3" height="1.6" rx="0.8" opacity="0.25" /><rect x="58" y="11" width="3" height="1.6" rx="0.8" opacity="0.25" /><rect x="10" y="19" width="3.5" height="1.6" rx="0.8" opacity="0.2" /><rect x="58" y="59" width="3" height="1.6" rx="0.8" opacity="0.2" /><rect x="18" y="59" width="3.5" height="1.6" rx="0.8" opacity="0.2" /><rect x="42" y="3" width="3" height="1.6" rx="0.8" opacity="0.2" />
    </g>
    <rect width="64" height="64" fill="url(#cj-pool)" />

    <!-- antlers rising from the top of the card: a curving main beam with upward tines and a brow tine -->
    <g fill="none" stroke="url(#cj-g)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" filter="url(#cj-glow)">
      <path d="M28.5 28C27.2 22 24 17.5 18.5 13.5C15.5 11.3 13.5 8.5 12.5 5" />
      <path d="M26.6 21.6C26 17.6 26.6 14.2 28.4 10.8" />
      <path d="M21.6 15.7C20.6 12.4 20.9 9.2 22.4 6.2" />
      <path d="M28 25.6C25.3 24.7 22.6 25 20.2 26.3" />
      <path d="M35.5 28C36.8 22 40 17.5 45.5 13.5C48.5 11.3 50.5 8.5 51.5 5" />
      <path d="M37.4 21.6C38 17.6 37.4 14.2 35.6 10.8" />
      <path d="M42.4 15.7C43.4 12.4 43.1 9.2 41.6 6.2" />
      <path d="M36 25.6C38.7 24.7 41.4 25 43.8 26.3" />
    </g>

    <!-- the Jack card -->
    <rect x="20.5" y="28" width="23" height="30" rx="3.2" fill="#f4f7fb" stroke="url(#cj-g)" stroke-width="1.5" />
    <g fill="url(#cj-ink)" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="800">
      <text x="22.7" y="35" font-size="6.8">J</text>
      <use href="#cj-spade" transform="translate(24.6 38.6) scale(0.38)" />
      <use href="#cj-spade" transform="translate(32 42.8) scale(0.85)" />
      <g transform="rotate(180 32 43)">
        <text x="22.7" y="35" font-size="6.8">J</text>
        <use href="#cj-spade" transform="translate(24.6 38.6) scale(0.38)" />
      </g>
    </g>
  </g>
</svg>
